version: 1
project: KANJI-EVERYDAY
always:
  - project-context.md
  - coding-standards.md
  - security-standards.md
  - common-failure-patterns.md
routes:
  frontend:
    patterns:
      - frontend/app/**
      - frontend/src/components/**
    documents:
      - architecture/frontend.md
      - architecture/frontend-api-patterns.md
      - design-system.md
      - ui-design-integration.md
  server_actions:
    patterns:
      - frontend/src/actions/**
      - frontend/src/lib/supabase/**
    documents:
      - architecture/backend.md
      - architecture/frontend-api-patterns.md
      - testing-guide.md
  database:
    patterns:
      - supabase/**
      - frontend/src/types/database.ts
    documents:
      - database-conventions.md
      - infrastructure-testing.md
      - security-standards.md
  illustration:
    patterns:
      - frontend/src/lib/illustration/**
      - frontend/src/actions/illustration-actions.ts
    documents:
      - architecture/backend.md
      - security-standards.md
      - testing-guide.md
  specifications:
    patterns:
      - specs/**
      - .claude/templates/**
    documents:
      - story-structure.md
      - technical-spec.md
      - documentation-criteria.md
      - implementation-flow.md
  testing:
    patterns:
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - specs/stories/**/tests/**
    documents:
      - testing-guide.md
      - regression-prevention.md
      - review-checklist.md
  local_ui_verification:
    patterns:
      - frontend/app/**
      - frontend/src/components/**
      - frontend/src/styles/**
    documents:
      - local-dev-and-ui-verification.md
      - design-system.md
      - ui-design-integration.md
workflow:
  - implementation-flow.md
  - architecture/implementation-approach.md
  - review-checklist.md
